# Publishes the web UI (src/eigentoken/web) to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The site is then at https://<user>.github.io/<repo>/, or at the custom domain set
# there (https://eigentoken.samuelherts.com); the page uses relative paths, so it
# works at any sub-path. Pull requests are checked but not deployed.
#
# Pages hosts only the interface. The analyses run in a Python server: the Raspberry
# Pi set up by deploy/pi, unless the repo variable EIGENTOKEN_API names another.
# That server must allow the site's origin with --cors-origin (deploy/pi does).
# A visitor can still pick a different one with ?api=URL.
name: Web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The render tests need a live server with a model loaded, so CI only checks
      # that the script parses.
      - run: node --check src/eigentoken/web/app.js
      # The page served by `eigentoken serve` leaves the API address empty (same
      # origin); the Pages copy gets the server's address written in.
      - name: Point the page at the API server
        env:
          API: ${{ vars.EIGENTOKEN_API || 'https://eigentoken-api.samuelherts.com' }}
        run: |
          cp -r src/eigentoken/web _site
          sed -i "s|<meta name=\"eigentoken-api\" content=\"\">|<meta name=\"eigentoken-api\" content=\"$API\">|" _site/index.html
          grep -F "content=\"$API\"" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One deployment at a time; a newer push replaces a queued (not a running) one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
