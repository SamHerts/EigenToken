[project]
name = "eigentoken"
version = "0.1.0"
description = "Compare and analyze token embedding geometry across LLM models — web app, CLI and library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",
    "transformers>=4.44",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
eigentoken = "eigentoken.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eigentoken"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
